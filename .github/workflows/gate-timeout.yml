name: Gate Timeout

on:
  schedule:
    # Corre a cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Permite correr manualmente para testes

jobs:
  check-timeouts:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Check gate timeouts
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            // ─── Config ────────────────────────────────────────────────────────────
            // Timeouts em segundos por classificação
            const TIMEOUTS = {
              routine:  4 * 60 * 60,      // 4 horas
              complex:  24 * 60 * 60,     // 24 horas
              critical: 72 * 60 * 60      // 72 horas
            };

            // Labels de gate que têm timeout
            const GATE_LABELS = {
              'status:plan-review':  'timeout:gate1',
              'status:code-review':  'timeout:gate2',
              'status:verify':       'timeout:gate3'
            };

            const now = new Date();

            // ─── Helpers ───────────────────────────────────────────────────────────
            function getLabel(issue, prefix) {
              return issue.labels.map(l => l.name).find(l => l.startsWith(prefix)) || null;
            }

            function hasLabel(issue, name) {
              return issue.labels.map(l => l.name).includes(name);
            }

            async function addLabel(issueNumber, label) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label]
                });
              } catch (e) {
                core.warning(`Cannot add label ${label} to #${issueNumber}: ${e.message}`);
              }
            }

            async function removeLabel(issueNumber, label) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch {}
            }

            async function postComment(issueNumber, body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }

            async function notifyTelegram(issue, message) {
              const token = process.env.TELEGRAM_BOT_TOKEN;
              const chatId = process.env.TELEGRAM_CHAT_ID;
              if (!token || !chatId) return;

              const project = getLabel(issue, 'project:') || 'sem-projecto';
              const text = [
                `⏰ *Gate Timeout — MultiAgente AI*`,
                ``,
                `🚫 Task bloqueada por inactividade`,
                `📋 [${issue.title}](${issue.html_url})`,
                `🏷 \`${project}\` · #${issue.number}`,
                ``,
                message
              ].join('\n');

              try {
                await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    chat_id: chatId,
                    text,
                    parse_mode: 'Markdown',
                    disable_web_page_preview: false
                  })
                });
              } catch (e) {
                core.warning(`Telegram notification failed: ${e.message}`);
              }
            }

            // ─── Main: buscar Issues em estados de gate ────────────────────────────
            const gateStatuses = Object.keys(GATE_LABELS);
            let totalChecked = 0;
            let totalExpired = 0;

            for (const gateStatus of gateStatuses) {
              // Buscar Issues abertos com este status label
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: gateStatus,
                per_page: 100
              });

              core.info(`Checking ${issues.length} issues in ${gateStatus}`);
              totalChecked += issues.length;

              for (const issue of issues) {
                // Já está blocked? Skip
                if (hasLabel(issue, 'status:blocked')) continue;

                // Determinar timeout baseado na classificação
                const classLabel = getLabel(issue, 'classification:');
                const classification = classLabel ? classLabel.replace('classification:', '') : 'complex';
                const timeoutSeconds = TIMEOUTS[classification] || TIMEOUTS.complex;

                // Calcular tempo desde última actualização
                const updatedAt = new Date(issue.updated_at);
                const elapsedSeconds = (now - updatedAt) / 1000;

                if (elapsedSeconds < timeoutSeconds) continue; // Ainda dentro do prazo

                // EXPIRADO — bloquear
                totalExpired++;
                const timeoutLabel = GATE_LABELS[gateStatus];
                const elapsedHours = Math.round(elapsedSeconds / 3600);
                const limitHours = Math.round(timeoutSeconds / 3600);

                core.warning(`Issue #${issue.number} expired: ${elapsedHours}h > ${limitHours}h limit`);

                // Adicionar labels de timeout + blocked
                await addLabel(issue.number, timeoutLabel);
                await removeLabel(issue.number, gateStatus);
                await addLabel(issue.number, 'status:blocked');

                // Comentar no Issue
                await postComment(issue.number, [
                  `## ⏰ Gate Timeout — Auto-block`,
                  ``,
                  `<details><summary>🔄 <strong>Audit</strong>: ${gateStatus} → status:blocked (system)</summary>`,
                  ``,
                  `| Campo | Valor |`,
                  `|-------|-------|`,
                  `| From | \`${gateStatus}\` |`,
                  `| To | \`status:blocked\` |`,
                  `| Actor | system (gate-timeout.yml) |`,
                  `| Motivo | Timeout de gate expirou |`,
                  `| Tempo em gate | ${elapsedHours}h |`,
                  `| Limite para \`${classification}\` | ${limitHours}h |`,
                  `| Timestamp | ${now.toISOString()} |`,
                  ``,
                  `</details>`,
                  ``,
                  `---`,
                  ``,
                  `**Para retomar a task:**`,
                  `1. Remove o label \`status:blocked\``,
                  `2. Adiciona o label \`${gateStatus}\` novamente`,
                  `3. Comenta \`/approve\` ou \`/changes\` para progredir`
                ].join('\n'));

                // Notificar Telegram
                await notifyTelegram(issue, [
                  `🔄 \`${gateStatus}\` → \`status:blocked\``,
                  `⏱ ${elapsedHours}h sem resposta (limite: ${limitHours}h para \`${classification}\`)`,
                  ``,
                  `_Remove label blocked + readiciona ${gateStatus} para retomar_`
                ].join('\n'));
              }
            }

            core.info(`Gate timeout check complete: ${totalChecked} issues checked, ${totalExpired} expired`);

            // Summary
            if (totalExpired > 0) {
              core.warning(`⚠️ ${totalExpired} gate(s) expirado(s) e bloqueado(s)`);
            } else {
              core.info('✅ Nenhum gate expirado');
            }
