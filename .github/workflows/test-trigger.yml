name: Test Trigger

on:
  repository_dispatch:
    types: [test-event]
  workflow_dispatch:
    inputs:
      test_input:
        description: 'Test input'
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "Triggered by ${{ github.event_name }}"
