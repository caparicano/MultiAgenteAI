name: Review Perplexity

# Trigger principal: repository_dispatch (imune à limitação do GITHUB_TOKEN)
# Fallback: issues:labeled (para adições manuais de label via UI/CLI)
# Debug: workflow_dispatch (teste manual no GitHub Actions UI)
on:
  repository_dispatch:
    types: [trigger-perplexity-review]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to review'
        required: true
        type: number

jobs:
  review:
    # Para issues:labeled, só corre quando status:planning é adicionado
    # Para repository_dispatch e workflow_dispatch, corre sempre
    if: |
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'status:planning')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Perplexity AI Review
        uses: actions/github-script@v7
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            // ─── Resolver issue number consoante o tipo de trigger ───────────────
            let issueNumber;
            let issue;

            if (context.eventName === 'repository_dispatch') {
              // Trigger via orchestrate.yml → repository_dispatch
              issueNumber = context.payload.client_payload?.issue_number;
              if (!issueNumber) {
                core.setFailed('repository_dispatch sem issue_number no client_payload');
                return;
              }
              // Buscar issue completo via API
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = data;
            } else if (context.eventName === 'workflow_dispatch') {
              // Trigger manual via GitHub Actions UI
              issueNumber = parseInt(context.payload.inputs.issue_number, 10);
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = data;
            } else {
              // Trigger via issues:labeled
              issue = context.payload.issue;
              issueNumber = issue.number;
            }

            core.info(`Reviewing Issue #${issueNumber}: ${issue.title}`);

            // ─── Helpers ───────────────────────────────────────────────────────────
            function getLabel(issue, prefix) {
              return issue.labels.map(l => l.name).find(l => l.startsWith(prefix)) || null;
            }

            async function addLabel(label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [label]
              });
            }

            async function removeLabel(label) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch {}
            }

            async function postComment(body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }

            // ─── Extrair contexto do Issue ─────────────────────────────────────────
            const project = getLabel(issue, 'project:') || 'unknown';
            const classification = (getLabel(issue, 'classification:') || 'classification:complex').replace('classification:', '');
            const priority = (getLabel(issue, 'priority:') || 'priority:medium').replace('priority:', '');

            // Buscar comments do Issue para encontrar o plano (pode ter sido adicionado como comment)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 50
            });

            // Combinar corpo do Issue + comments relevantes (excluir audit logs)
            const planComments = comments
              .filter(c => !c.body.includes('<details><summary>🔄'))
              .filter(c => !c.body.includes('Audit'))
              .map(c => c.body)
              .join('\n\n---\n\n');

            const fullContext = `# Issue #${issueNumber}: ${issue.title}\n\n${issue.body}\n\n---\n\n## Comments:\n${planComments || '(no plan comments yet)'}`;

            // ─── Chamar Perplexity API ──────────────────────────────────────────────
            const apiKey = process.env.PERPLEXITY_API_KEY;
            if (!apiKey) {
              core.warning('PERPLEXITY_API_KEY not configured — skipping review');
              await postComment('⚠️ **Perplexity Review skipped**: `PERPLEXITY_API_KEY` não configurada nos GitHub Secrets.');
              return;
            }

            core.info('Calling Perplexity API...');

            const systemPrompt = [
              'You are a senior code reviewer and software architect for a multi-agent AI orchestration system.',
              'You are reviewing a task plan that will be implemented by AI agents (Claude Code for planning/coding, Lovable for UI implementation).',
              '',
              'Context:',
              `- Project: ${project}`,
              `- Classification: ${classification}`,
              `- Priority: ${priority}`,
              '- The project uses Lovable with internal Supabase (no external API access to the DB)',
              '- SQL migrations must be applied manually by the human operator in Lovable SQL Editor',
              '- The plan will be executed by AI agents, so it must be precise and unambiguous',
              '',
              'Review the plan for:',
              '1. Clarity (1-10): Is the plan clear enough for AI agents to execute without ambiguity?',
              '2. Completeness (1-10): Does it cover all edge cases, error handling, and rollback?',
              '3. Safety (1-10): Are there destructive operations? Is RLS considered? Any security risks?',
              '4. Scope (1-10): Is the scope well-bounded? Risk of scope creep?',
              '5. SQL Safety (1-10, or N/A): If SQL is involved, is it transactional? Idempotent? Safe to apply?',
              '',
              'Return your response as valid JSON with this exact structure:',
              '{',
              '  "score": <overall 1-10>,',
              '  "approved": <true if score >= 7>,',
              '  "summary": "<2-3 sentence summary>",',
              '  "findings": [',
              '    {"severity": "high|medium|low", "finding": "<description>", "suggestion": "<how to fix>"}',
              '  ],',
              '  "clarity": <1-10>,',
              '  "completeness": <1-10>,',
              '  "safety": <1-10>,',
              '  "scope": <1-10>,',
              '  "sql_safety": <1-10 or null>',
              '}'
            ].join('\n');

            let reviewResult = null;
            let rawResponse = '';

            // 3x retry com backoff
            let delay = 2000;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch('https://api.perplexity.ai/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    model: 'sonar-reasoning-pro',
                    messages: [
                      { role: 'system', content: systemPrompt },
                      { role: 'user', content: fullContext }
                    ],
                    max_tokens: 4000,
                    temperature: 0.1
                  })
                });

                if (!response.ok) {
                  const errBody = await response.text();
                  core.warning(`Perplexity attempt ${attempt} HTTP ${response.status}: ${errBody}`);
                  if (attempt < 3) {
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 3;
                    continue;
                  }
                  throw new Error(`Perplexity API returned ${response.status}`);
                }

                const data = await response.json();
                rawResponse = data.choices?.[0]?.message?.content || '';
                core.info(`Perplexity raw response (${rawResponse.length} chars)`);

                // Parse JSON do response (pode estar embedded em markdown)
                const jsonMatch = rawResponse.match(/\{[\s\S]*"score"[\s\S]*\}/);
                if (jsonMatch) {
                  reviewResult = JSON.parse(jsonMatch[0]);
                  break;
                } else {
                  core.warning(`Attempt ${attempt}: Could not parse JSON from Perplexity response`);
                  if (attempt < 3) {
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 3;
                  }
                }
              } catch (e) {
                core.warning(`Perplexity attempt ${attempt} error: ${e.message}`);
                if (attempt < 3) {
                  await new Promise(r => setTimeout(r, delay));
                  delay *= 3;
                }
              }
            }

            // ─── Processar resultado ────────────────────────────────────────────────

            if (!reviewResult) {
              // Falha total — reportar mas não bloquear
              await postComment([
                `## 🤖 Perplexity Review — ⚠️ Falhou`,
                ``,
                `A Perplexity API não devolveu uma review válida após 3 tentativas.`,
                `A task pode prosseguir para aprovação manual sem review AI.`,
                ``,
                `<details><summary>Raw response (debug)</summary>`,
                ``,
                '```',
                rawResponse.substring(0, 2000) || '(empty)',
                '```',
                `</details>`
              ].join('\n'));

              // Transitar para plan-review mesmo sem review — Luis decide
              await removeLabel('status:planning');
              await addLabel('status:plan-review');
              return;
            }

            // Review válida — postar resultado
            const score = reviewResult.score;
            const approved = reviewResult.approved;
            const scoreEmoji = score >= 8 ? '🟢' : score >= 6 ? '🟡' : '🔴';
            const approvedText = approved ? '✅ Aprovado' : '❌ Alterações recomendadas';

            // Formatar findings
            const findingsTable = (reviewResult.findings || []).length > 0
              ? [
                  `| Severidade | Finding | Sugestão |`,
                  `|-----------|---------|----------|`,
                  ...(reviewResult.findings || []).map(f =>
                    `| ${f.severity === 'high' ? '🔴' : f.severity === 'medium' ? '🟡' : '🔵'} ${f.severity} | ${f.finding} | ${f.suggestion} |`
                  )
                ].join('\n')
              : '_Sem findings específicos._';

            // Sub-scores
            const subScores = [
              `| Clarity | ${reviewResult.clarity || '-'}/10 |`,
              `| Completeness | ${reviewResult.completeness || '-'}/10 |`,
              `| Safety | ${reviewResult.safety || '-'}/10 |`,
              `| Scope | ${reviewResult.scope || '-'}/10 |`,
              reviewResult.sql_safety != null ? `| SQL Safety | ${reviewResult.sql_safety}/10 |` : null
            ].filter(Boolean).join('\n');

            await postComment([
              `## 🤖 Perplexity Review — Score: ${scoreEmoji} ${score}/10`,
              ``,
              `**Veredicto:** ${approvedText}`,
              ``,
              `> ${reviewResult.summary || ''}`,
              ``,
              `### Sub-scores`,
              `| Dimensão | Score |`,
              `|----------|-------|`,
              subScores,
              ``,
              `### Findings`,
              findingsTable,
              ``,
              `---`,
              `_Review automática por [Perplexity sonar-reasoning-pro](https://perplexity.ai). Luis toma a decisão final._`
            ].join('\n'));

            // Adicionar label de score
            await addLabel(`perplexity:score-${Math.min(10, Math.max(1, Math.round(score)))}`);

            // Transitar planning → plan-review
            await removeLabel('status:planning');
            await addLabel('status:plan-review');

            // Audit entry
            await postComment([
              `<details><summary>🔄 <strong>Audit</strong>: status:planning → status:plan-review (system)</summary>`,
              ``,
              `| Campo | Valor |`,
              `|-------|-------|`,
              `| From | \`status:planning\` |`,
              `| To | \`status:plan-review\` |`,
              `| Actor | system (review-perplexity.yml) |`,
              `| Perplexity Score | ${score}/10 |`,
              `| Approved by AI | ${approved} |`,
              `| Timestamp | ${new Date().toISOString()} |`,
              ``,
              `</details>`
            ].join('\n'));

            // ─── Telegram ──────────────────────────────────────────────────────────
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            if (token && chatId) {
              const priorityEmoji = { low: '🔵', medium: '🟡', high: '🟠', critical: '🔴' }[priority] || '⚪';
              const text = [
                `${priorityEmoji} *MultiAgente AI*`,
                ``,
                `👁 *GATE 1 — Plan Review*`,
                ``,
                `📋 [${issue.title}](${issue.html_url})`,
                `🏷 \`${project}\` · \`${classification}\` · \`${priority}\``,
                `🤖 Perplexity: ${scoreEmoji} ${score}/10 — ${approved ? 'Aprovado' : 'Alterações recomendadas'}`,
                ``,
                `💬 _Responde no Issue com /approve ou /changes_`
              ].join('\n');

              try {
                await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    chat_id: chatId,
                    text,
                    parse_mode: 'Markdown',
                    disable_web_page_preview: false
                  })
                });
              } catch (e) {
                core.warning(`Telegram notification failed: ${e.message}`);
              }
            }

            core.info(`Perplexity review complete: score=${score}, approved=${approved}`);
