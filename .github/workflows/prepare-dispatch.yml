name: Dispatch Prepare

# Fase 3 — Valida e prepara dispatch requests.
# A EXECUÇÃO real é feita pelo Claude Code local (browser control).
# Este workflow apenas valida pré-condições e prepara o pedido.

on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    # Só corre para comandos /dispatch-review ou /dispatch-review-sql
    # Os outros /dispatch-* são tratados pelo orchestrate.yml
    if: |
      startsWith(github.event.comment.body, '/dispatch-review') &&
      !startsWith(github.event.comment.body, '/dispatch-review-sql --')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Perplexity pre-flight review
        uses: actions/github-script@v7
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const issueNumber = issue.number;
            const body = comment.body.trim();

            // ─── Helpers ───────────────────────────────────────────────────────────
            function getLabel(prefix) {
              return issue.labels.map(l => l.name).find(l => l.startsWith(prefix)) || null;
            }

            function hasLabel(name) {
              return issue.labels.map(l => l.name).includes(name);
            }

            async function addLabel(label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [label]
              });
            }

            async function postComment(text) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: text
              });
            }

            // ─── Validações ────────────────────────────────────────────────────────
            const currentStatus = getLabel('status:');
            if (!['status:execution', 'status:migration', 'status:planning'].includes(currentStatus)) {
              await postComment(`⚠️ \`/dispatch-review\` não é válido no estado \`${currentStatus}\`. Requer \`execution\`, \`migration\`, ou \`planning\`.`);
              return;
            }

            const apiKey = process.env.PERPLEXITY_API_KEY;
            if (!apiKey) {
              await postComment('⚠️ `PERPLEXITY_API_KEY` não configurada nos GitHub Secrets.');
              return;
            }

            // ─── Determinar o que vai ser analisado ────────────────────────────────
            const isSqlReview = body.startsWith('/dispatch-review-sql');
            const project = getLabel('project:') || 'unknown';

            // Buscar conteúdo do Issue + comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });

            let contentToReview = '';

            if (isSqlReview) {
              // Encontrar último bloco SQL nos comments
              for (let i = comments.length - 1; i >= 0; i--) {
                const sqlMatch = comments[i].body.match(/```sql\n([\s\S]*?)```/);
                if (sqlMatch) {
                  contentToReview = sqlMatch[1];
                  break;
                }
              }
              if (!contentToReview) {
                // Tentar no body do Issue
                const bodyMatch = issue.body?.match(/```sql\n([\s\S]*?)```/);
                if (bodyMatch) contentToReview = bodyMatch[1];
              }
              if (!contentToReview) {
                await postComment('⚠️ Nenhum bloco SQL encontrado no Issue para review.');
                return;
              }
            } else {
              // Review geral — combinar Issue body + comments relevantes
              const planComments = comments
                .filter(c => !c.body.includes('<details><summary>'))
                .filter(c => !c.body.startsWith('⚠️'))
                .map(c => c.body);
              contentToReview = `${issue.body}\n\n---\n\n${planComments.join('\n\n---\n\n')}`;
            }

            // ─── Chamar Perplexity API ──────────────────────────────────────────────
            const sqlReviewPrompt = [
              'You are a SQL security reviewer. Analyze this SQL migration for:',
              '1. Safety: Are there destructive operations (DROP, TRUNCATE, ALTER TABLE)?',
              '2. Idempotency: Can it be run twice safely (IF NOT EXISTS, etc.)?',
              '3. Transactional: Is it wrapped in BEGIN/COMMIT?',
              '4. RLS: If it creates tables, are RLS policies defined?',
              '5. Side effects: Could it break existing data or schemas?',
              '',
              'Return JSON: {"score": 1-10, "approved": true/false, "risks": ["..."], "suggestions": ["..."], "sql_safe": true/false}'
            ].join('\n');

            const dispatchReviewPrompt = [
              'You are a pre-flight reviewer for a dispatch operation. An AI agent is about to execute this instruction on Lovable (a code generation platform). Review for:',
              '1. Clarity: Will Lovable understand exactly what to do?',
              '2. Scope: Is the instruction well-bounded?',
              '3. Safety: Any risk of data loss, schema drift, or unintended changes?',
              '4. Completeness: Does the instruction have all needed context?',
              '',
              'Return JSON: {"score": 1-10, "approved": true/false, "risks": ["..."], "suggestions": ["..."], "scope_assessment": "bounded|vague|risky"}'
            ].join('\n');

            const systemPrompt = isSqlReview ? sqlReviewPrompt : dispatchReviewPrompt;

            let reviewResult = null;
            let delay = 2000;

            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch('https://api.perplexity.ai/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    model: 'sonar-reasoning-pro',
                    messages: [
                      { role: 'system', content: systemPrompt },
                      { role: 'user', content: `Project: ${project}\n\n${contentToReview}` }
                    ],
                    max_tokens: 3000,
                    temperature: 0.1
                  })
                });

                if (!response.ok) {
                  core.warning(`Perplexity attempt ${attempt}: HTTP ${response.status}`);
                  if (attempt < 3) { await new Promise(r => setTimeout(r, delay)); delay *= 3; continue; }
                  throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const raw = data.choices?.[0]?.message?.content || '';
                const jsonMatch = raw.match(/\{[\s\S]*"score"[\s\S]*\}/);
                if (jsonMatch) {
                  reviewResult = JSON.parse(jsonMatch[0]);
                  break;
                }
              } catch (e) {
                core.warning(`Attempt ${attempt} error: ${e.message}`);
                if (attempt < 3) { await new Promise(r => setTimeout(r, delay)); delay *= 3; }
              }
            }

            if (!reviewResult) {
              await postComment('⚠️ **Pre-flight review falhou** — Perplexity API não devolveu resultado válido.');
              return;
            }

            // ─── Reportar resultado ─────────────────────────────────────────────────
            const score = reviewResult.score;
            const approved = score >= 7;
            const emoji = score >= 8 ? '🟢' : score >= 6 ? '🟡' : '🔴';
            const type = isSqlReview ? 'SQL' : 'Instrução';

            const risksFormatted = (reviewResult.risks || []).length > 0
              ? (reviewResult.risks || []).map(r => `- ⚠️ ${r}`).join('\n')
              : '_Sem riscos detectados._';

            const suggestionsFormatted = (reviewResult.suggestions || []).length > 0
              ? (reviewResult.suggestions || []).map(s => `- 💡 ${s}`).join('\n')
              : '_Sem sugestões._';

            await postComment([
              `## 🔍 Pre-flight Review — ${type} — ${emoji} ${score}/10`,
              ``,
              `**Veredicto:** ${approved ? '✅ OK para dispatch' : '❌ Requer revisão antes de dispatch'}`,
              ``,
              `### Riscos`,
              risksFormatted,
              ``,
              `### Sugestões`,
              suggestionsFormatted,
              ``,
              isSqlReview && reviewResult.sql_safe != null ? `**SQL Safe:** ${reviewResult.sql_safe ? '✅' : '❌'}` : '',
              !isSqlReview && reviewResult.scope_assessment ? `**Scope:** \`${reviewResult.scope_assessment}\`` : '',
              ``,
              `---`,
              approved
                ? `_Pre-flight OK. Pode prosseguir com \`/dispatch-lovable\` ou \`/dispatch-sql\`._`
                : `_Pre-flight falhou. Recomendado ajustar a instrução antes de dispatch._`
            ].filter(Boolean).join('\n'));

            // Labels
            await addLabel(approved ? 'dispatch:preflight-ok' : 'dispatch:preflight-fail');
