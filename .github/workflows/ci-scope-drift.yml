name: CI Scope Drift Check

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  scope-drift:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check scope drift
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // ─── Extrair Issue linkado ao PR ───────────────────────────────────────
            // Convenção: branch name é "orchestra/issue-{N}" ou PR body tem "Closes #N"
            let issueNumber = null;

            // Tentar branch name
            const branchMatch = pr.head.ref.match(/issue-(\d+)/);
            if (branchMatch) issueNumber = parseInt(branchMatch[1]);

            // Tentar body do PR
            if (!issueNumber && pr.body) {
              const bodyMatch = pr.body.match(/(closes|fixes|resolves)\s+#(\d+)/i);
              if (bodyMatch) issueNumber = parseInt(bodyMatch[2]);
            }

            if (!issueNumber) {
              core.info('No linked issue found — skipping scope drift check');
              return;
            }

            core.info(`Checking scope drift for Issue #${issueNumber}`);

            // ─── Ler files_affected_planned do Issue ───────────────────────────────
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            // Parse do Issue body — procurar secção "Ficheiros planeados" ou YAML frontmatter
            let plannedFiles = [];

            // Tentar extrair de YAML frontmatter
            const yamlMatch = issue.body?.match(/files_affected_planned:\s*\[(.*?)\]/s);
            if (yamlMatch) {
              plannedFiles = yamlMatch[1].split(',').map(f => f.trim().replace(/['"]/g, '')).filter(Boolean);
            }

            // Tentar extrair da secção "Ficheiros planeados" (issue template)
            if (plannedFiles.length === 0) {
              const sectionMatch = issue.body?.match(/### Ficheiros planeados\s*\n([\s\S]*?)(?=\n###|\n---|\Z)/);
              if (sectionMatch) {
                plannedFiles = sectionMatch[1].trim().split('\n')
                  .map(l => l.trim().replace(/^[-*]\s*/, ''))
                  .filter(f => f && !f.startsWith('_') && f.includes('.'));
              }
            }

            if (plannedFiles.length === 0) {
              core.info('No planned files found in Issue body — skipping drift check');
              // Still useful to report what files were actually changed
              return;
            }

            core.info(`Planned files (${plannedFiles.length}): ${plannedFiles.join(', ')}`);

            // ─── Obter ficheiros realmente alterados no PR ─────────────────────────
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const actualFiles = prFiles.map(f => f.filename);
            core.info(`Actual files (${actualFiles.length}): ${actualFiles.join(', ')}`);

            // ─── Comparar ──────────────────────────────────────────────────────────
            const unexpected = actualFiles.filter(f => !plannedFiles.includes(f));
            const missing = plannedFiles.filter(f => !actualFiles.includes(f));
            const matched = actualFiles.filter(f => plannedFiles.includes(f));

            const hasDrift = unexpected.length > 0 || missing.length > 0;

            // ─── Labels no Issue ───────────────────────────────────────────────────
            if (hasDrift) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['scope:drift-detected']
              });
            } else {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['scope:clean']
              });
            }

            // ─── Comment no PR ─────────────────────────────────────────────────────
            const driftEmoji = hasDrift ? '⚠️' : '✅';
            const statusText = hasDrift ? 'Scope Drift Detected' : 'Scope Clean';

            const unexpectedTable = unexpected.length > 0
              ? unexpected.map(f => {
                  const fileInfo = prFiles.find(pf => pf.filename === f);
                  return `| \`${f}\` | +${fileInfo?.additions || 0} / -${fileInfo?.deletions || 0} | ${fileInfo?.status || ''} |`;
                }).join('\n')
              : null;

            const missingTable = missing.length > 0
              ? missing.map(f => `| \`${f}\` | — | expected but not changed |`).join('\n')
              : null;

            const sections = [
              `## ${driftEmoji} Scope Drift Check — ${statusText}`,
              ``,
              `Issue: #${issueNumber} | Planned: ${plannedFiles.length} files | Actual: ${actualFiles.length} files`,
              ``
            ];

            if (matched.length > 0) {
              sections.push(
                `### ✅ Files matched (${matched.length})`,
                ...matched.map(f => `- \`${f}\``),
                ``
              );
            }

            if (unexpectedTable) {
              sections.push(
                `### 🔴 Unexpected files (${unexpected.length}) — NOT in plan`,
                `| File | Changes | Status |`,
                `|------|---------|--------|`,
                unexpectedTable,
                ``
              );
            }

            if (missingTable) {
              sections.push(
                `### 🟡 Missing files (${missing.length}) — planned but NOT changed`,
                `| File | Changes | Status |`,
                `|------|---------|--------|`,
                missingTable,
                ``
              );
            }

            sections.push(
              `---`,
              `_Scope drift check by ci-scope-drift.yml. Linked to Issue #${issueNumber}._`
            );

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: sections.join('\n'),
              event: hasDrift ? 'COMMENT' : 'APPROVE'
            });

            // Comment no Issue se drift
            if (hasDrift) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `## ⚠️ Scope Drift no PR #${pr.number}`,
                  ``,
                  unexpected.length > 0 ? `**${unexpected.length} ficheiro(s) inesperado(s):** ${unexpected.map(f => `\`${f}\``).join(', ')}` : '',
                  missing.length > 0 ? `**${missing.length} ficheiro(s) em falta:** ${missing.map(f => `\`${f}\``).join(', ')}` : '',
                  ``,
                  `[Ver PR #${pr.number}](${pr.html_url})`,
                  ``,
                  `_Verificar se as alterações extra são legítimas ou scope creep do agente._`
                ].filter(Boolean).join('\n')
              });
            }

            if (hasDrift) {
              core.warning(`⚠️ Scope drift: ${unexpected.length} unexpected, ${missing.length} missing`);
            } else {
              core.info('✅ Scope clean — all files match plan');
            }
