name: Notify Telegram

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      issue_title:
        required: true
        type: string
      issue_url:
        required: true
        type: string
      project:
        required: false
        type: string
        default: ''
      status:
        required: true
        type: string
      priority:
        required: false
        type: string
        default: 'medium'
      classification:
        required: false
        type: string
        default: 'complex'
      message:
        required: false
        type: string
        default: ''
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;

            const priorityEmoji = {
              low: '🔵',
              medium: '🟡',
              high: '🟠',
              critical: '🔴'
            }['${{ inputs.priority }}'] || '⚪';

            const statusEmoji = {
              'planning':     '📝',
              'plan-review':  '👁 GATE 1',
              'execution':    '⚙️',
              'code-review':  '🔍 GATE 2',
              'migration':    '🗄️',
              'verify':       '✅ GATE 3',
              'done':         '🎉',
              'blocked':      '🚫',
              'cancelled':    '❌',
            }['${{ inputs.status }}'] || '🔄';

            const lines = [
              `${priorityEmoji} *MultiAgente AI*`,
              ``,
              `${statusEmoji} *${{ inputs.status }}*`,
              ``,
              `📋 [${{ inputs.issue_title }}](${{ inputs.issue_url }})`,
              `🏷 \`${{ inputs.project || 'sem-projecto' }}\` · \`${{ inputs.classification }}\` · \`${{ inputs.priority }}\``,
              `#${{ inputs.issue_number }}`,
            ];

            const extraMsg = '${{ inputs.message }}';
            if (extraMsg) lines.push(``, extraMsg);

            // Slash command hints por estado
            const hints = {
              'plan-review':  `\n💬 _Responde no Issue com \/approve ou \/changes_`,
              'code-review':  `\n💬 _Responde no Issue com \/approve ou \/changes_`,
              'verify':       `\n💬 _Responde no Issue com \/verify-ok_`,
              'migration':    `\n💬 _Aplica o SQL e responde com \/migration-done_`,
              'blocked':      `\n💬 _Ver Issue para detalhes_`,
            }['${{ inputs.status }}'] || '';
            if (hints) lines.push(hints);

            const text = lines.join('\n');

            // 3x retry com backoff exponencial (1s → 4s → 16s)
            let delay = 1000;
            let success = false;

            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    chat_id: chatId,
                    text,
                    parse_mode: 'Markdown',
                    disable_web_page_preview: false
                  })
                });

                const body = await response.json();

                if (response.ok && body.ok) {
                  core.info(`✅ Telegram notification sent (attempt ${attempt})`);
                  success = true;
                  break;
                } else {
                  core.warning(`Telegram attempt ${attempt} failed: ${JSON.stringify(body)}`);
                }
              } catch (e) {
                core.warning(`Telegram attempt ${attempt} error: ${e.message}`);
              }

              if (attempt < 3) {
                core.info(`Retrying in ${delay}ms...`);
                await new Promise(r => setTimeout(r, delay));
                delay *= 4;
              }
            }

            if (!success) {
              core.error('❌ Telegram notification failed after 3 attempts');
              // Add notification:failed label to the issue
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: ${{ inputs.issue_number }},
                  labels: ['notification:failed']
                });
              } catch (e) {
                core.warning(`Could not add notification:failed label: ${e.message}`);
              }
              // Don't fail the workflow — notification failure is non-blocking
              core.warning('Notification failed but workflow continues');
            }
