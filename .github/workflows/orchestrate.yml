name: Orchestrate

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process event
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const eventName = context.eventName;
            const action = context.payload.action;

            // ─── Helpers ───────────────────────────────────────────────────────────

            function getLabels(issue) {
              return issue.labels.map(l => l.name);
            }

            function hasLabel(issue, name) {
              return getLabels(issue).includes(name);
            }

            function getStatusLabel(issue) {
              return getLabels(issue).find(l => l.startsWith('status:')) || null;
            }

            function getProjectLabel(issue) {
              return getLabels(issue).find(l => l.startsWith('project:')) || null;
            }

            function getClassification(issue) {
              const l = getLabels(issue).find(l => l.startsWith('classification:'));
              return l ? l.replace('classification:', '') : 'complex';
            }

            async function addLabel(issueNumber, label) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label]
                });
              } catch (e) {
                core.warning(`Failed to add label ${label}: ${e.message}`);
              }
            }

            async function removeLabel(issueNumber, label) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch (e) {
                // Label might not exist — ignore
              }
            }

            async function postComment(issueNumber, body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }

            async function transitionStatus(issueNumber, fromStatus, toStatus, actor, details = '') {
              if (fromStatus) await removeLabel(issueNumber, fromStatus);
              await addLabel(issueNumber, toStatus);
              const detailsSection = details ? `\n\n${details}` : '';
              await postComment(issueNumber, [
                `<details><summary>🔄 <strong>Audit</strong>: ${fromStatus || 'new'} → ${toStatus} (${actor})</summary>`,
                ``,
                `| Campo | Valor |`,
                `|-------|-------|`,
                `| From | \`${fromStatus || 'new'}\` |`,
                `| To | \`${toStatus}\` |`,
                `| Actor | ${actor} |`,
                `| Timestamp | ${new Date().toISOString()} |`,
                detailsSection,
                `</details>`
              ].join('\n'));
            }

            // ─── STATE MACHINE VALID TRANSITIONS ──────────────────────────────────
            const VALID_TRANSITIONS = {
              'status:intake':       ['status:planning', 'status:blocked', 'status:cancelled'],
              'status:planning':     ['status:plan-review', 'status:blocked', 'status:cancelled'],
              'status:plan-review':  ['status:execution', 'status:planning', 'status:blocked', 'status:cancelled'],
              'status:execution':    ['status:code-review', 'status:planning', 'status:blocked', 'status:cancelled'],
              'status:code-review':  ['status:migration', 'status:verify', 'status:execution', 'status:blocked', 'status:cancelled'],
              'status:migration':    ['status:verify', 'status:blocked', 'status:cancelled'],
              'status:verify':       ['status:done', 'status:execution', 'status:blocked', 'status:cancelled'],
              'status:blocked':      ['status:planning', 'status:plan-review', 'status:execution', 'status:code-review', 'status:migration', 'status:verify', 'status:cancelled'],
              'status:done':         [],
              'status:cancelled':    []
            };

            // Gate timeouts in seconds (routing: classification → timeout)
            const GATE_TIMEOUTS = { routine: 14400, complex: 86400, critical: 259200 };

            // ─── SLASH COMMAND HANDLER ─────────────────────────────────────────────
            async function handleSlashCommand(issue, comment) {
              const body = comment.body.trim();
              const issueNumber = issue.number;
              const currentStatus = getStatusLabel(issue);
              const actor = comment.user.login;

              // /approve
              if (body.startsWith('/approve')) {
                if (currentStatus === 'status:plan-review') {
                  await removeLabel(issueNumber, 'gate1:changes');
                  await addLabel(issueNumber, 'gate1:approved');
                  await transitionStatus(issueNumber, currentStatus, 'status:execution', actor,
                    '| Gate | gate1 (plan review) |\n| Decision | approved |');
                }
                else if (currentStatus === 'status:code-review') {
                  await removeLabel(issueNumber, 'gate2:changes');
                  await addLabel(issueNumber, 'gate2:approved');
                  // Has SQL? → migration, else → verify
                  const labels = getLabels(issue);
                  const nextStatus = labels.includes('has:sql') ? 'status:migration' : 'status:verify';
                  await transitionStatus(issueNumber, currentStatus, nextStatus, actor,
                    `| Gate | gate2 (code review) |\n| Decision | approved |\n| Next | ${nextStatus} |`);
                }
                else {
                  await postComment(issueNumber, `⚠️ \`/approve\` não é válido no estado \`${currentStatus}\``);
                }
              }

              // /changes [texto]
              else if (body.startsWith('/changes')) {
                const changeText = body.replace('/changes', '').trim() || '(sem detalhes)';
                if (currentStatus === 'status:plan-review') {
                  await addLabel(issueNumber, 'gate1:changes');
                  await transitionStatus(issueNumber, currentStatus, 'status:planning', actor,
                    `| Gate | gate1 |\n| Decision | changes_requested |\n| Motivo | ${changeText} |`);
                }
                else if (currentStatus === 'status:code-review') {
                  await addLabel(issueNumber, 'gate2:changes');
                  await transitionStatus(issueNumber, currentStatus, 'status:execution', actor,
                    `| Gate | gate2 |\n| Decision | changes_requested |\n| Motivo | ${changeText} |`);
                }
                else {
                  await postComment(issueNumber, `⚠️ \`/changes\` não é válido no estado \`${currentStatus}\``);
                }
              }

              // /migration-done
              else if (body.startsWith('/migration-done')) {
                if (currentStatus === 'status:migration') {
                  await transitionStatus(issueNumber, currentStatus, 'status:verify', actor,
                    '| Action | SQL migration confirmada como aplicada |');
                } else {
                  await postComment(issueNumber, `⚠️ \`/migration-done\` não é válido no estado \`${currentStatus}\``);
                }
              }

              // /verify-ok
              else if (body.startsWith('/verify-ok')) {
                if (currentStatus === 'status:verify') {
                  await addLabel(issueNumber, 'gate3:approved');
                  await transitionStatus(issueNumber, currentStatus, 'status:done', actor,
                    '| Gate | gate3 (verify) |\n| Decision | approved |');
                  // Close the issue
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    state: 'closed',
                    state_reason: 'completed'
                  });
                } else {
                  await postComment(issueNumber, `⚠️ \`/verify-ok\` não é válido no estado \`${currentStatus}\``);
                }
              }

              // /block [motivo]
              else if (body.startsWith('/block')) {
                const blockReason = body.replace('/block', '').trim() || '(sem motivo)';
                await transitionStatus(issueNumber, currentStatus, 'status:blocked', actor,
                  `| Motivo | ${blockReason} |`);
              }

              // /cancel
              else if (body.startsWith('/cancel')) {
                await transitionStatus(issueNumber, currentStatus, 'status:cancelled', actor,
                  '| Action | Task cancelada manualmente |');
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'not_planned'
                });
              }

              // /plan-ready — Claude Code sinaliza que o plano foi revisto e está pronto para review
              else if (body.startsWith('/plan-ready')) {
                if (currentStatus === 'status:planning') {
                  await postComment(issueNumber, '🔄 Plano revisto — a disparar review Perplexity...');
                  try {
                    await github.rest.repos.createDispatchEvent({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      event_type: 'trigger-perplexity-review',
                      client_payload: {
                        issue_number: issueNumber,
                        triggered_by: `/plan-ready by ${actor}`,
                        timestamp: new Date().toISOString()
                      }
                    });
                  } catch (e) {
                    await postComment(issueNumber, `⚠️ Falha ao disparar review: ${e.message}. Usa Actions → Review Perplexity → Run workflow → Issue ${issueNumber}`);
                  }
                } else {
                  await postComment(issueNumber, `⚠️ \`/plan-ready\` só é válido em \`status:planning\`. Estado actual: \`${currentStatus}\``);
                }
              }

              // /dispatch-* (Fase 3 — preparação)
              else if (body.startsWith('/dispatch-')) {
                await handleDispatchCommand(issue, comment, body);
              }

              // Unknown command
              else if (body.startsWith('/')) {
                const knownCommands = ['/approve', '/changes', '/plan-ready', '/migration-done', '/verify-ok', '/block', '/cancel', '/dispatch-lovable', '/dispatch-sql', '/dispatch-review', '/dispatch-abort', '/dispatch-skip'];
                await postComment(issueNumber,
                  `⚠️ Comando desconhecido: \`${body.split(' ')[0]}\`\n\n**Comandos disponíveis:**\n${knownCommands.map(c => `- \`${c}\``).join('\n')}`
                );
              }
            }

            // ─── DISPATCH COMMAND HANDLER (Fase 3) ────────────────────────────────
            async function handleDispatchCommand(issue, comment, body) {
              const issueNumber = issue.number;
              const currentStatus = getStatusLabel(issue);
              const labels = getLabels(issue);

              // /dispatch-abort
              if (body.startsWith('/dispatch-abort')) {
                await removeLabel(issueNumber, 'dispatch:ready');
                await removeLabel(issueNumber, 'dispatch:in-progress');
                await addLabel(issueNumber, 'dispatch:skipped');
                await postComment(issueNumber, '🛑 **Dispatch abortado.** A task continua no estado actual — usa o fluxo manual.');
                return;
              }

              // /dispatch-skip
              if (body.startsWith('/dispatch-skip')) {
                await addLabel(issueNumber, 'dispatch:skipped');
                await postComment(issueNumber, '⏭️ **Dispatch ignorado.** Usa o fluxo manual base para esta task.');
                return;
              }

              // Validações comuns
              if (!['status:execution', 'status:migration'].includes(currentStatus)) {
                await postComment(issueNumber, `⚠️ Dispatch só é válido em \`status:execution\` ou \`status:migration\`. Estado actual: \`${currentStatus}\``);
                return;
              }

              const projectConfig = getProjectLabel(issue);
              if (!projectConfig) {
                await postComment(issueNumber, '⚠️ Dispatch requer label `project:*` no Issue.');
                return;
              }

              if (labels.includes('dispatch:in-progress')) {
                await postComment(issueNumber, '⚠️ Já existe um dispatch em progresso nesta task. Usa `/dispatch-abort` para cancelar primeiro.');
                return;
              }

              // Validate gate1 approved for execution
              if (currentStatus === 'status:execution' && !labels.includes('gate1:approved')) {
                await postComment(issueNumber, '⚠️ Dispatch requer `gate1:approved`. O plano ainda não foi aprovado.');
                return;
              }

              // Prepare dispatch request
              const dispatchType = body.startsWith('/dispatch-sql') ? 'sql-editor' :
                                   body.startsWith('/dispatch-review') ? 'perplexity-review' : 'lovable-chat';
              const withReview = body.includes('--with-review');
              const classification = getClassification(issue);

              await addLabel(issueNumber, 'dispatch:ready');
              await postComment(issueNumber, [
                `## 🚀 Dispatch Request`,
                ``,
                `| Campo | Valor |`,
                `|-------|-------|`,
                `| Tipo | \`${dispatchType}\` |`,
                `| Projecto | \`${projectConfig}\` |`,
                `| Estado actual | \`${currentStatus}\` |`,
                `| Classificação | \`${classification}\` |`,
                `| Pre-flight Perplexity | ${withReview ? '✅ activado' : '❌ não solicitado'} |`,
                `| Solicitado por | @${comment.user.login} |`,
                ``,
                `### Pré-condições verificadas`,
                `- ✅ Estado válido para dispatch`,
                `- ✅ Gate anterior aprovado`,
                `- ✅ Projecto configurado`,
                ``,
                `### Próximo passo`,
                `Dispatch preparado. Claude Code deve ler este Issue e executar o Protocolo ${dispatchType === 'sql-editor' ? 'B (SQL Editor)' : 'A (Lovable Chat)'}.`,
                ``,
                `> **Para cancelar:** comenta \`/dispatch-abort\``
              ].join('\n'));

            }

            // ─── MAIN ROUTER ───────────────────────────────────────────────────────

            // Novo Issue criado → garantir status:intake (template já adiciona)
            if (eventName === 'issues' && action === 'opened') {
              const labels = getLabels(issue);
              if (!labels.find(l => l.startsWith('status:'))) {
                await addLabel(issue.number, 'status:intake');
              }
              // NÃO auto-transitar para planning — o Claude Code decide quando o
              // plano está pronto e transita manualmente com:
              //   gh issue edit N --remove-label status:intake --add-label status:planning
            }

            // Label status:planning adicionado → dispara review Perplexity via repository_dispatch
            // Nota: GITHUB_TOKEN não gera novos workflow runs para issues/labeled events,
            // mas repository_dispatch é ISENTO dessa limitação — é sempre processado.
            else if (eventName === 'issues' && action === 'labeled' &&
                     context.payload.label?.name === 'status:planning') {
              core.info('status:planning detectado — a disparar review-perplexity via repository_dispatch');
              try {
                await github.rest.repos.createDispatchEvent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  event_type: 'trigger-perplexity-review',
                  client_payload: {
                    issue_number: issue.number,
                    triggered_by: 'orchestrate.yml',
                    timestamp: new Date().toISOString()
                  }
                });
                core.info(`repository_dispatch 'trigger-perplexity-review' enviado para Issue #${issue.number}`);
              } catch (e) {
                core.warning(`Falha ao disparar review-perplexity: ${e.message}`);
                // Fallback: postar comment avisando que a review deve ser disparada manualmente
                await postComment(issue.number, '⚠️ Auto-trigger da review Perplexity falhou. Para disparar manualmente: Actions → Review Perplexity → Run workflow → Issue number: ' + issue.number);
              }
            }

            // Issue fechado manualmente (sem /cancel ou /verify-ok)
            else if (eventName === 'issues' && action === 'closed') {
              const currentStatus = getStatusLabel(issue);
              if (currentStatus && !['status:done', 'status:cancelled'].includes(currentStatus)) {
                await addLabel(issue.number, 'status:cancelled');
              }
            }

            // Issue reaberto
            else if (eventName === 'issues' && action === 'reopened') {
              await removeLabel(issue.number, 'status:cancelled');
              await removeLabel(issue.number, 'status:done');
              await addLabel(issue.number, 'status:intake');
              await postComment(issue.number, '🔄 Issue reaberto. Estado reiniciado para `status:intake`. Adiciona as labels de projecto/classificação/prioridade e comenta para retomar.');
            }

            // Comment com slash command
            else if (eventName === 'issue_comment' && action === 'created') {
              const body = comment.body.trim();
              if (body.startsWith('/')) {
                await handleSlashCommand(issue, comment);
              }
            }

            core.info('Orchestrate step completed');
